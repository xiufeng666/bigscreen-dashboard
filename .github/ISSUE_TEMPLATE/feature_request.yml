name: 功能建议 / Feature request
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述使用场景与痛点，而不是直接给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: input
    id: canvas
    attributes:
      label: 相关屏幕比例 / 分辨率（如涉及展示端）
      placeholder: "4:3 1920×1440 / 21:9 2560×1080 …"
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过已有 Issue 与文档，确认这不是已有功能
          required: true
        - label: 该功能保持离线、零外部依赖（或说明为什么需要例外）
          required: false
