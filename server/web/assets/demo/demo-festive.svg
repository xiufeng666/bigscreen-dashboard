<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1120 680" width="1120" height="680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#e6402f"/>
      <stop offset="0.45" stop-color="#c9191f"/>
      <stop offset="1" stop-color="#9c0d15"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.06" r="0.72">
      <stop offset="0" stop-color="#ffe9a0" stop-opacity="0.5"/>
      <stop offset="0.42" stop-color="#ffb347" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff8a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf0"/>
      <stop offset="0.38" stop-color="#fff0b0"/>
      <stop offset="0.72" stop-color="#ffd451"/>
      <stop offset="1" stop-color="#f0a52e"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9891c"/>
      <stop offset="0.5" stop-color="#fff3bd"/>
      <stop offset="1" stop-color="#ffe070"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffb02e"/>
      <stop offset="0.6" stop-color="#ffd451"/>
      <stop offset="1" stop-color="#fff6c8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <g id="lantern">
      <path d="M0 0v26" stroke="#ffe9a0" stroke-width="2" stroke-opacity="0.75"/>
      <rect x="-16" y="26" width="32" height="7" rx="3" fill="url(#gold)"/>
      <ellipse cx="0" cy="78" rx="44" ry="48" fill="#db241f" stroke="#ffd451" stroke-width="2.4"/>
      <ellipse cx="0" cy="78" rx="44" ry="48" fill="none" stroke="#ffd451" stroke-opacity="0.55" stroke-width="1.2"/>
      <g stroke="#ffe9a0" stroke-opacity="0.8" stroke-width="1.6" fill="none">
        <ellipse cx="0" cy="78" rx="28" ry="46"/>
        <ellipse cx="0" cy="78" rx="13" ry="44"/>
        <path d="M-42 64H42M-42 92H42"/>
      </g>
      <rect x="-28" y="124" width="56" height="9" rx="4" fill="url(#gold)"/>
      <path d="M0 133v16" stroke="#ffd451" stroke-width="3"/>
      <path d="M-16 150h32l-5 34h-22z" fill="#d3211f" stroke="#ffd451" stroke-width="1.4"/>
    </g>
    <g id="cloud">
      <circle cx="0" cy="0" r="16" fill="#ffd451" opacity="0.22"/>
      <circle cx="22" cy="-8" r="20" fill="#ffd451" opacity="0.22"/>
      <circle cx="46" cy="2" r="15" fill="#ffd451" opacity="0.22"/>
      <rect x="-12" y="2" width="72" height="14" rx="7" fill="#ffd451" opacity="0.22"/>
    </g>
  </defs>

  <!-- 底色 + 放射霞光 -->
  <rect width="1120" height="680" fill="url(#bg)"/>
  <g opacity="0.5">
    <g stroke="#ffe9a0" stroke-opacity="0.16" stroke-width="26">
      <path d="M560 30 232 680M560 30 388 680M560 30 560 680M560 30 732 680M560 30 888 680"/>
    </g>
  </g>
  <rect width="1120" height="680" fill="url(#sun)"/>
  <ellipse cx="560" cy="700" rx="620" ry="200" fill="#ff9a3c" opacity="0.16" filter="url(#soft)"/>

  <!-- 金色边框 -->
  <rect x="20" y="20" width="1080" height="640" rx="18" fill="none" stroke="#ffd451" stroke-opacity="0.55" stroke-width="2.4"/>
  <rect x="32" y="32" width="1056" height="616" rx="12" fill="none" stroke="#ffe9a0" stroke-opacity="0.22" stroke-width="1.2"/>

  <!-- 灯笼 -->
  <g transform="translate(92 0) scale(0.92)"><use href="#lantern" xlink:href="#lantern"/></g>
  <g transform="translate(1028 0) scale(0.74)"><use href="#lantern" xlink:href="#lantern"/></g>
  <g transform="translate(182 0) scale(0.56)"><use href="#lantern" xlink:href="#lantern"/></g>

  <!-- 烟花 -->
  <g transform="translate(210 190)" stroke="#ffe9a0" fill="none" filter="url(#glow)" opacity="0.9">
    <g stroke-width="2.6" stroke-linecap="round">
      <path d="M0-18V-74M0 18V74M-18 0H-74M18 0H74M-14-14-52-52M14 14 52 52M-14 14-52 52M14-14 52-52"/>
    </g>
    <g stroke="#ffd451" stroke-width="1.6" stroke-opacity="0.8">
      <path d="M-8-26-24-70M8-26 24-70M-8 26-24 70M8 26 24 70M-26-8-70-24M26-8 70-24M-26 8-70 24M26 8 70 24"/>
    </g>
    <g fill="#fff6c8" stroke="none">
      <circle cx="0" cy="-82" r="2.6"/><circle cx="58" cy="-58" r="2.2"/><circle cx="82" cy="0" r="2.6"/>
      <circle cx="58" cy="58" r="2.2"/><circle cx="0" cy="82" r="2.6"/><circle cx="-58" cy="58" r="2.2"/>
      <circle cx="-82" cy="0" r="2.6"/><circle cx="-58" cy="-58" r="2.2"/>
    </g>
  </g>
  <g transform="translate(910 448) scale(0.8)" stroke="#ffe9a0" fill="none" filter="url(#glow)" opacity="0.85">
    <g stroke-width="2.4" stroke-linecap="round">
      <path d="M0-18V-70M0 18V70M-18 0H-70M18 0H70M-13-13-49-49M13 13 49 49M-13 13-49 49M13-13 49-49"/>
    </g>
    <g fill="#fff6c8" stroke="none">
      <circle cx="0" cy="-78" r="2.4"/><circle cx="55" cy="0" r="2.4"/><circle cx="0" cy="78" r="2.4"/><circle cx="-55" cy="0" r="2.4"/>
    </g>
  </g>

  <!-- 标题 -->
  <g>
    <text x="560" y="150" text-anchor="middle" font-family="'Songti SC','STSong','SimSun',serif" font-size="58" font-weight="700" letter-spacing="16" fill="url(#gold)" filter="url(#glow)">欢 度 佳 节</text>
    <text x="560" y="192" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" letter-spacing="11" fill="#ffe9b8">FESTIVAL DATA CELEBRATION</text>
    <g stroke="url(#goldLine)" stroke-width="1.6">
      <path d="M300 214h520"/>
    </g>
    <rect x="550" y="208" width="20" height="12" transform="skewX(-32)" fill="#ffe070"/>
  </g>

  <!-- 中部：喜庆数据看板 -->
  <g>
    <!-- 左：柱状图 -->
    <g>
      <rect x="70" y="252" width="470" height="238" rx="10" fill="#a51218" fill-opacity="0.62" stroke="#ffd451" stroke-opacity="0.42"/>
      <text x="96" y="292" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="600" letter-spacing="3" fill="#fff0b8">节日活动热度</text>
      <g>
        <rect x="106" y="404" width="48" height="54" rx="4" fill="url(#bar)" opacity="0.85"/>
        <rect x="180" y="370" width="48" height="88" rx="4" fill="url(#bar)" opacity="0.9"/>
        <rect x="254" y="336" width="48" height="122" rx="4" fill="url(#bar)" opacity="0.95"/>
        <rect x="328" y="386" width="48" height="72" rx="4" fill="url(#bar)" opacity="0.9"/>
        <rect x="402" y="316" width="48" height="142" rx="4" fill="url(#bar)"/>
      </g>
      <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ffd9a0" text-anchor="middle">
        <text x="130" y="478">初一</text>
        <text x="204" y="478">初二</text>
        <text x="278" y="478">初三</text>
        <text x="352" y="478">初四</text>
        <text x="426" y="478">初五</text>
      </g>
      <g font-family="'DIN Alternate','Bahnschrift',monospace" font-size="15" fill="#fff6d8" text-anchor="middle">
        <text x="426" y="304">98.6</text>
      </g>
      <path d="M96 330h418" stroke="#ffe070" stroke-opacity="0.18"/>
    </g>

    <!-- 右：数据 + 福字 -->
    <g>
      <rect x="572" y="252" width="478" height="238" rx="10" fill="#a51218" fill-opacity="0.62" stroke="#ffd451" stroke-opacity="0.42"/>
      <text x="598" y="292" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="600" letter-spacing="3" fill="#fff0b8">节日运行指标</text>
      <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#ffd9a0">
        <text x="598" y="342">活动参与人次</text>
        <text x="598" y="390">安全巡检完成</text>
        <text x="598" y="438">群众满意度</text>
      </g>
      <g font-family="'DIN Alternate','Bahnschrift',monospace" font-size="28" fill="#fff6d8" text-anchor="end">
        <text x="1004" y="346">128,640</text>
        <text x="1004" y="394">100%</text>
        <text x="1004" y="442">99.2%</text>
      </g>
      <g stroke="#ffd451" stroke-opacity="0.16">
        <path d="M598 356h406M598 404h406M598 452h406"/>
      </g>
    </g>
  </g>

  <!-- 底部祥云与祝福 -->
  <g>
    <g transform="translate(70 540)"><use href="#cloud" xlink:href="#cloud" transform="scale(1.5)"/></g>
    <g transform="translate(260 548)"><use href="#cloud" xlink:href="#cloud" transform="scale(1.2)"/></g>
    <g transform="translate(470 540)"><use href="#cloud" xlink:href="#cloud" transform="scale(1.6)"/></g>
    <g transform="translate(710 548)"><use href="#cloud" xlink:href="#cloud" transform="scale(1.25)"/></g>
    <g transform="translate(880 540)"><use href="#cloud" xlink:href="#cloud" transform="scale(1.5)"/></g>
    <text x="560" y="632" text-anchor="middle" font-family="'Songti SC','STSong','SimSun',serif" font-size="34" font-weight="700" letter-spacing="12" fill="url(#gold)">喜庆祥和 · 万事顺遂</text>
    <text x="560" y="662" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" letter-spacing="8" fill="#ffd9a0">BIGSCREEN · FESTIVE TEMPLATE</text>
  </g>
</svg>
