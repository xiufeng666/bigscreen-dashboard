<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 280" width="160" height="280">
  <defs>
    <linearGradient id="lt-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8352c"/>
      <stop offset="0.45" stop-color="#c8171b"/>
      <stop offset="1" stop-color="#8f0c10"/>
    </linearGradient>
    <radialGradient id="lt-hi" cx="0.35" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#ff8a63" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#e3302a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7d0a0d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lt-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.5" stop-color="#ffd451"/>
      <stop offset="1" stop-color="#e09b2a"/>
    </linearGradient>
    <filter id="lt-glow" x="-60%" y="-30%" width="220%" height="170%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 吊绳 -->
  <path d="M80 0V38" stroke="#ffd451" stroke-opacity="0.65" stroke-width="2"/>
  <circle cx="80" cy="40" r="5" fill="#ffe9a3" opacity="0.9"/>
  <rect x="62" y="42" width="36" height="9" rx="3" fill="url(#lt-gold)"/>
  <rect x="66" y="51" width="28" height="6" rx="2" fill="#c8171b" stroke="#ffd451" stroke-width="1.4"/>

  <!-- 灯笼主体 -->
  <g filter="url(#lt-glow)">
    <ellipse cx="80" cy="112" rx="52" ry="56" fill="url(#lt-body)"/>
    <ellipse cx="80" cy="112" rx="52" ry="56" fill="url(#lt-hi)"/>
    <!-- 灯骨 -->
    <g stroke="#ffd451" stroke-opacity="0.9" stroke-width="1.6" fill="none">
      <ellipse cx="80" cy="112" rx="34" ry="54"/>
      <ellipse cx="80" cy="112" rx="16" ry="52"/>
      <path d="M28 96h104M28 128h104"/>
    </g>
    <!-- 金色上下箍 -->
    <rect x="30" y="52" width="100" height="12" rx="6" fill="url(#lt-gold)"/>
    <rect x="30" y="160" width="100" height="12" rx="6" fill="url(#lt-gold)"/>
  </g>

  <!-- 流苏 -->
  <path d="M80 172v22" stroke="#ffd451" stroke-width="3"/>
  <path d="M62 194h36l-6 44h-24z" fill="#d3211f" stroke="#ffd451" stroke-width="1.6"/>
  <g stroke="#ffd451" stroke-width="1.4" stroke-opacity="0.85">
    <path d="M68 238v26M76 238v30M84 238v30M92 238v26"/>
  </g>
</svg>
